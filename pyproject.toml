[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-base-generator"
version = "0.1.0"
description = "Generate verified, Obsidian-compatible knowledge bases with GitHub/GCP-ready scaffolding"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Uptec-khj"}]
dependencies = []

[project.scripts]
kbgen = "kb_generator.cli:main"

[tool.setuptools]
packages = ["kb_generator"]
