name: test-generator

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m kb_generator '해상풍력' -o /tmp/offshore-wind-kb --countries KR AU --gcp-level 2
      - run: python /tmp/offshore-wind-kb/scripts/validate_kb.py /tmp/offshore-wind-kb
